<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHAI // INTERNAL NETWORK</title>
    <style>
        :root {
            --glow-color: #00fff2;
            --bg-color: #000000;
            --panel-bg: rgba(0, 20, 5, 0.6);
            --text-color: #00fff2;
            --alert-color: #ff0077;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: crosshair;
        }

        body {
            background-color: var(--bg-color);
            color: var(--glow-color);
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* CRT Scanline and Flicker Effects */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .screen {
            padding: 40px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: radial-gradient(circle, rgba(0,30,10,0.3) 0%, rgba(0,0,0,0.8) 100%);
        }

        .container {
            text-align: center;
            background: black;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        input {
            padding: 10px;
            font-size: 16px;
            margin-right: 10px;
            border: 1px solid #00FFF2;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #00fff2;
            color: white;
            border: 1px solid #00fff2;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #00fff2;
        }
        .error {
            color: #ff0077;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Access Required</h2>
    <p>Please enter your access code to proceed:</p>
    <input type="text" id="code-input" placeholder="Enter code here...">
    <button onclick="checkCode()">Submit</button>
    <div id="error-message" class="error">Incorrect code. Please try again.</div>
</div>

<script>
    function checkCode() {
        const userInput = document.getElementById('code-input').value;
        const errorMessage = document.getElementById('error-message');
        
        const secretCode1 = "ihatemyjob"; 
        const secretCode2 = "director"; 
        
        if (userInput === secretCode1) {
            errorMessage.style.display = 'none';
            window.location.href = "vesper.html";
        } else if (userInput === secretCode2) {
            errorMessage.style.display = 'none';
            window.location.href = "orion.html";
        } else {
            errorMessage.style.display = 'block';
        }
    }
</script>

</body>
</html>
