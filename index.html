<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Code</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #00fff2;
        }
        .container {
            text-align: center;
            background: #00fff2;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        input {
            padding: 10px;
            font-size: 16px;
            margin-right: 10px;
            border: 1px solid #00FFF2;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #00fff2;
            color: white;
            border: 1px solid #00fff2;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #00fff2;
        }
        .error {
            color: red;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Access Required</h2>
    <p>Please enter your access code to proceed:</p>
    <input type="text" id="code-input" placeholder="Enter code here...">
    <button onclick="checkCode()">Submit</button>
    <div id="error-message" class="error">Incorrect code. Please try again.</div>
</div>

<script>
    function checkCode() {
        const userInput = document.getElementById('code-input').value;
        const errorMessage = document.getElementById('error-message');
        
        const secretCode = "vesper"; 
        
        if (userInput === secretCode) {
            errorMessage.style.display = 'none';
            window.location.href = "secret.html";
        } else {
            errorMessage.style.display = 'block';
        }
    }
</script>

</body>
</html>
